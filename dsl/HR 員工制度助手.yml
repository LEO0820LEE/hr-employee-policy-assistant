    opening_statement: '您好，我是 HR 員工制度助手。


      我可以協助查詢請假與出勤、員工福利，以及新進員工報到流程。

      我會依據公司知識庫回答；若問題涉及薪資、個資、帳號權限或勞資爭議，請聯絡 HR 或相關負責單位確認。'
