      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 請問交通補助怎麼申請？
    - 病假超過幾天需要醫療證明？
    - 新進員工報到需要攜帶什麼？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
